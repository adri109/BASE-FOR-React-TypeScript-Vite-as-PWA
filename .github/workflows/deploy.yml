name: Deploy (Cloudflare Pages)

# Opcional. Se ejecuta solo si la variable de repositorio DEPLOY_CLOUDFLARE == 'true'
# y existen los secretos CLOUDFLARE_API_TOKEN y CLOUDFLARE_ACCOUNT_ID.
# Variables de repositorio: CLOUDFLARE_PAGES_PROJECT, VITE_SUPABASE_URL, VITE_APP_URL.
# Secretos: VITE_SUPABASE_ANON_KEY (clave anon; es pública pero se inyecta en build).

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    if: ${{ vars.DEPLOY_CLOUDFLARE == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_APP_URL: ${{ vars.VITE_APP_URL }}
      - name: Publish
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy apps/web/dist --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT }} --branch=${{ github.ref_name }}
