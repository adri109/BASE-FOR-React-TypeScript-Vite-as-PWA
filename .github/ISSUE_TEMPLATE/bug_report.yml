name: Bug
description: Algo no funciona como debería
labels: [bug]
body:
  - type: textarea
    id: expected
    attributes:
      label: Comportamiento esperado
    validations: { required: true }
  - type: textarea
    id: actual
    attributes:
      label: Comportamiento actual
    validations: { required: true }
  - type: textarea
    id: steps
    attributes:
      label: Pasos para reproducir
      placeholder: |
        1. ...
        2. ...
    validations: { required: true }
  - type: input
    id: env
    attributes:
      label: Entorno
      description: Navegador y versión, sistema operativo, dispositivo, commit. Indica si es la PWA instalada o la pestaña del navegador.
    validations: { required: true }
