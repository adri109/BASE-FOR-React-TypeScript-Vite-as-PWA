# yaml-language-server: $schema=../../schema/theme.schema.json
id: b2-phrasal-verbs-work
level: B2
branch: vocabulary
title: Phrasal verbs at work
summary: Phrasal verbs frecuentes en contextos laborales.
prerequisites: []
explanation: |
  Verbos con partícula cuyo significado no se deduce de sus partes.
  Los transitivos separables admiten el pronombre en medio: *put it off*, no *put off it*.
commonErrors:
  - wrong: We have to put off it until Monday.
    right: We have to put it off until Monday.
