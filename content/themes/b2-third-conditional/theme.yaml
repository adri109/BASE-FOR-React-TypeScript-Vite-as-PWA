# yaml-language-server: $schema=../../schema/theme.schema.json
id: b2-third-conditional
level: B2
branch: grammar
title: Third conditional
summary: Situaciones pasadas irreales - if + past perfect, would have + participio.
prerequisites: [b1-first-conditional]
explanation: |
  Se usa para imaginar un pasado distinto del real, normalmente para expresar arrepentimiento o reproche.

  Estructura: **if + past perfect**, **would have + past participle**.
commonErrors:
  - wrong: If I would have known, I would have told you.
    right: If I had known, I would have told you.
    note: En la cláusula con "if" se usa past perfect, nunca "would have".
