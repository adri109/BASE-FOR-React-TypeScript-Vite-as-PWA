# yaml-language-server: $schema=../../schema/exercises.schema.json
theme: b1-first-conditional
exercises:
  - id: q1
    type: multiple_choice
    prompt: Choose the correct sentence.
    options:
      - If you will study, you will pass.
      - If you study, you will pass.
      - If you studied, you will pass.
    answer: 1
    explanation: La condición va en presente simple; el resultado, con will.
  - id: q2
    type: fill_blank
    prompt: Complete with the correct form of the verb "miss".
    sentence: If we leave now, we won't ___ the train.
    accepted: [miss]
  - id: q3
    type: reorder
    prompt: Put the words in order.
    words: [If, it, rains, we, will, stay, home]
