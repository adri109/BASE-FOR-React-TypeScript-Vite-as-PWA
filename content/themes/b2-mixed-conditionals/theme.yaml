# yaml-language-server: $schema=../../schema/theme.schema.json
id: b2-mixed-conditionals
level: B2
branch: grammar
title: Mixed conditionals
summary: Causa en el pasado, efecto en el presente - if + past perfect, would + infinitivo.
prerequisites: [b2-third-conditional]
explanation: |
  Combina una condición pasada irreal con un resultado presente:
  **if + past perfect**, **would + infinitive**.
commonErrors:
  - wrong: If I studied medicine, I would be a doctor now.
    right: If I had studied medicine, I would be a doctor now.
